<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Mean Calculator</title>
</head>
<body>
    <h1>Arithmetic Mean Calculator</h1>
    
    <div>
        <h2>Data Entry</h2>
        
        <div>
            <label>Enter a value:</label>
            <input type="text" id="valueInput" placeholder="Enter a number">
            <button onclick="addValue()">Add Value</button>
            <button onclick="removeValue()">Remove Value</button>
        </div>
        
        <div id="message"></div>
        
        <h3>Current Dataset</h3>
        <div id="dataset"></div>
        
        <button onclick="computeMean()">Compute Mean</button>
        
        <h3>Current Mean</h3>
        <div id="meanResult">Mean: Not calculated</div>
    </div>

    <script>
        let dataset = [];
        
        function addValue() {
            const input = document.getElementById('valueInput');
            const value = input.value.trim();
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = '';
            
            if (value === '') {
                showMessage('Please enter a value', 'error');
                return;
            }
            
            const numValue = parseFloat(value);
            
            if (isNaN(numValue)) {
                showMessage('Invalid input: Please enter a valid number', 'error');
                return;
            }
            
            dataset.push(numValue);
            
            input.value = '';
            
            updateDatasetDisplay();
            showMessage('Value ' + numValue + ' added successfully', 'success');
            
            computeMean();
        }
        
        function removeValue() {
            const input = document.getElementById('valueInput');
            const value = input.value.trim();
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = '';
            
            if (value === '') {
                if (dataset.length === 0) {
                    showMessage('Dataset is empty - nothing to remove', 'error');
                    return;
                }
                
                const removedValue = dataset.pop();
                showMessage('Last value (' + removedValue + ') removed successfully', 'success');
            } else {
                const numValue = parseFloat(value);
                
                if (isNaN(numValue)) {
                    showMessage('Invalid input: Please enter a valid number to remove', 'error');
                    return;
                }
                
                const index = dataset.indexOf(numValue);
                
                if (index === -1) {
                    showMessage('Value ' + numValue + ' not found in dataset', 'error');
                    return;
                }
                
                dataset.splice(index, 1);
                showMessage('Value ' + numValue + ' removed successfully', 'success');
            }
            
            input.value = '';
            
            updateDatasetDisplay();
            
            computeMean();
        }
        
        function updateDatasetDisplay() {
            const datasetDiv = document.getElementById('dataset');
            
            if (dataset.length === 0) {
                datasetDiv.textContent = 'Dataset is empty';
            } else {
                datasetDiv.textContent = dataset.join(', ');
            }
        }
        
        function computeMean() {
            const meanResultDiv = document.getElementById('meanResult');
            
            if (dataset.length === 0) {
                meanResultDiv.textContent = 'Mean: Cannot calculate (dataset is empty)';
                return;
            }
            
            let sum = 0;
            for (let i = 0; i < dataset.length; i++) {
                sum += dataset[i];
            }
            
            const mean = sum / dataset.length;
            
            meanResultDiv.innerHTML = 'Mean: ' + mean;
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '<div>' + message + '</div>';
        }
        
        updateDatasetDisplay();
    </script>
</body>
</html>
